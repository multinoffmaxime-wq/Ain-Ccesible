<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ain'Ccessible Gestion">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14181C">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Ain'Ccessible Gestion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181C;
  --ink-soft:#3A4149;
  --paper:#F6F4EF;
  --paper-raised:#FFFFFF;
  --line:#DDD8CD;
  --rope:#D8511A;
  --rope-dark:#B8440F;
  --safety:#1F5F63;
  --safety-light:#E4F0EE;
  --ok:#2C7A4B;
  --warn:#B8440F;
  --danger:#A3271F;
  --muted:#7A7368;
  --radius:2px;
  --sidebar-w:216px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Manrope',-apple-system,system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
button, input, select, textarea{font-family:inherit;font-size:15px;color:inherit;}
button{cursor:pointer;}
a{color:inherit;}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--ink);
  color:#EDE9E1;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.sidebar-brand{
  padding:22px 20px 16px;
  border-bottom:1px solid rgba(255,255,255,.09);
}
.sidebar-brand .name{font-weight:800;font-size:16px;letter-spacing:.2px;line-height:1.25;}
.sidebar-brand .sub{font-size:11.5px;color:#A6ACA1;margin-top:4px;}
.sidebar-nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--radius);
  background:none;border:none;text-align:left;width:100%;
  color:#C7C2B7;font-weight:600;font-size:14px;
  transition:background .12s,color .12s;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--rope);color:#fff;}
.nav-item.active svg{opacity:1;}
.sidebar-foot{padding:14px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#7C8177;}

.main{flex:1;min-width:0;padding:28px 34px 90px;max-width:1080px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-size:22px;font-weight:800;letter-spacing:-.2px;}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:3px;}

/* Mobile bottom tabs */
.tabbar{display:none;}
.mobile-settings-fab{display:none;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:var(--radius);border:1px solid transparent;
  font-weight:700;font-size:13.5px;white-space:nowrap;
  background:var(--ink);color:#fff;
}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--rope);}
.btn.outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn.ghost{background:transparent;color:var(--ink-soft);padding:9px 10px;}
.btn.danger{background:transparent;color:var(--danger);border-color:#E7C9C4;}
.btn.sm{padding:6px 11px;font-size:12.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- Cards / tables ---------- */
.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);}
.card-pad{padding:20px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px;}
.stat{background:var(--paper-raised);border:1px solid var(--line);padding:16px 18px;border-radius:var(--radius);}
.stat .label{font-size:11.5px;color:var(--muted);font-weight:600;}
.stat .value{font-size:23px;font-weight:800;margin-top:6px;font-family:'JetBrains Mono',monospace;}
.stat .value.rope{color:var(--rope-dark);}
.stat .value.safety{color:var(--safety);}

table{width:100%;border-collapse:collapse;font-size:14px;}
thead th{
  text-align:left;font-size:11px;color:var(--muted);font-weight:700;
  padding:0 12px 8px;border-bottom:1px solid var(--line);
}
tbody td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:#FBFAF7;}
.list-wrap{overflow-x:auto;}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;
}
.badge.grey{background:#EDEAE3;color:var(--ink-soft);}
.badge.orange{background:#FBE6DA;color:var(--rope-dark);}
.badge.green{background:#DCEFE1;color:var(--ok);}
.badge.blue{background:var(--safety-light);color:var(--safety);}
.badge.red{background:#F4DDD9;color:var(--danger);}

.empty{padding:50px 20px;text-align:center;color:var(--muted);}
.empty .big{font-size:15px;color:var(--ink-soft);font-weight:700;margin-bottom:5px;}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);
  background:#fff;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--rope);outline-offset:-1px;}
.field textarea{resize:vertical;min-height:70px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:640px){.field-row,.field-row3{grid-template-columns:1fr;}}

/* ---------- Modal / drawer ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(20,24,28,.5);z-index:50;
  display:flex;justify-content:flex-end;
}
.overlay.center{justify-content:center;align-items:center;padding:20px;}
.drawer{
  width:min(560px,100%);background:var(--paper);height:100%;overflow-y:auto;
  padding:24px 26px 100px;
  animation:slidein .18s ease-out;
}
.overlay.center .drawer{
  width:min(420px,100%);height:auto;border-radius:var(--radius);
  padding:26px;animation:popin .14s ease-out;
}
@keyframes slidein{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes popin{from{transform:scale(.97);opacity:0;}to{transform:scale(1);opacity:1;}}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.drawer-head h2{font-size:18px;font-weight:800;}
.close-x{background:none;border:none;font-size:20px;color:var(--muted);padding:4px 8px;}
.drawer-actions{display:flex;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}

.divider{height:1px;background:var(--line);margin:20px 0;}
.section-title{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}

/* Line items editor */
.li-row{display:grid;grid-template-columns:1fr 60px 90px 70px 30px;gap:8px;align-items:center;margin-bottom:8px;}
.li-row input{padding:7px 9px;font-size:13.5px;}
.li-head{display:grid;grid-template-columns:1fr 60px 90px 70px 30px;gap:8px;font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:6px;}
@media(max-width:640px){.li-row,.li-head{grid-template-columns:1fr 45px 70px 55px 24px;}}
.li-remove{background:none;border:none;color:var(--danger);font-size:16px;}
.forfait-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px;}
.forfait-card{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:#fff;text-align:left;}
.forfait-card:hover{border-color:var(--rope);}
.forfait-card:active{transform:translateY(1px);}
.forfait-card .fd{font-size:12.5px;font-weight:700;line-height:1.3;}
.forfait-card .fp{font-size:12px;color:var(--safety);margin-top:4px;}
.totals-box{margin-top:14px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);}
.totals-box .row{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;}
.totals-box .row.grand{font-weight:800;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;}
.totals-box .row .mono{font-family:'JetBrains Mono',monospace;}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-nav{display:flex;align-items:center;gap:10px;}
.cal-title{font-weight:800;font-size:16px;min-width:150px;text-align:center;text-transform:capitalize;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.cal-dow{background:#EFEBE3;text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);padding:7px 0;}
.cal-cell{background:var(--paper-raised);min-height:88px;padding:6px;position:relative;}
.cal-cell.out{background:#FBFAF7;}
.cal-cell .dnum{font-size:12px;font-weight:700;color:var(--muted);}
.cal-cell.today .dnum{color:#fff;background:var(--rope);width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;}
.cal-evt{
  margin-top:4px;padding:3px 6px;border-radius:3px;font-size:10.5px;font-weight:600;
  background:var(--safety-light);color:var(--safety);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cal-evt.rope{background:#FBE6DA;color:var(--rope-dark);}
@media(max-width:760px){.cal-cell{min-height:60px;padding:4px;}.cal-evt{font-size:9px;padding:2px 4px;}}

.agenda-list{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.agenda-item{display:flex;gap:14px;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;cursor:pointer;}
.agenda-item:hover{border-color:var(--rope);}
.agenda-date{width:52px;flex-shrink:0;text-align:center;}
.agenda-date .d{font-size:19px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1;}
.agenda-date .m{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;}
.agenda-body{flex:1;min-width:0;}
.agenda-body .t{font-weight:700;font-size:14px;}
.agenda-body .meta{font-size:12px;color:var(--muted);margin-top:2px;}

/* Toolbar */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.toolbar input[type=search]{
  padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;
  min-width:180px;flex:1;
}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.seg button{padding:7px 12px;background:#fff;border:none;font-size:12.5px;font-weight:700;color:var(--ink-soft);border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--ink);color:#fff;}

/* Print sheet (facture/devis/livre) */
.print-sheet{background:#fff;color:#1a1a1a;max-width:800px;margin:0 auto;padding:46px;}
.ps-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px;}
.ps-client{min-width:240px;max-width:300px;border:1px solid #1a1a1a;padding:12px 14px;font-size:13px;line-height:1.55;}
.ps-client .cname{font-size:14px;font-weight:800;margin-bottom:4px;}
.ps-company{font-size:11px;line-height:1.5;}
.ps-company .cname{font-size:17px;font-weight:800;margin-bottom:4px;}
.ps-doc{text-align:right;}
.ps-doc .kind{font-size:22px;font-weight:800;letter-spacing:.3px;}
.ps-doc .num{font-family:'JetBrains Mono',monospace;color:#555;margin-top:2px;font-size:13px;}
.ps-doc .client-num{font-family:'JetBrains Mono',monospace;color:#999;margin-top:2px;font-size:10.5px;}
.ps-meta{display:flex;justify-content:space-between;gap:24px;margin-bottom:16px;font-size:13px;}
.ps-meta .block{line-height:1.6;}
.ps-meta .ps-dates{font-size:11px;}
.ps-meta .ps-dates b{font-size:9px !important;}
.ps-meta .block b{display:block;font-size:10.5px;text-transform:uppercase;color:#888;letter-spacing:.4px;margin-bottom:4px;font-weight:700;}
.ps-table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:13px;}
.ps-table th{text-align:left;font-size:10.5px;text-transform:uppercase;color:#888;padding:0 8px 8px;border-bottom:2px solid #1a1a1a;letter-spacing:.3px;}
.ps-table td{padding:6px 8px;border-bottom:1px solid #e5e2da;}
.ps-table th:last-child,.ps-table td:last-child{text-align:right;}
.ps-table th:nth-child(2),.ps-table td:nth-child(2),.ps-table th:nth-child(3),.ps-table td:nth-child(3){text-align:right;}
.ps-totals{margin-left:auto;width:260px;font-size:13.5px;}
.ps-totals .row{display:flex;justify-content:space-between;padding:5px 0;}
.ps-totals .row.grand{font-weight:800;font-size:16.5px;border-top:2px solid #1a1a1a;margin-top:6px;padding-top:10px;}
.ps-notes{margin-top:14px;font-size:12.5px;color:#555;line-height:1.5;white-space:pre-wrap;}
.ps-legal{margin-top:16px;padding-top:10px;border-top:1px solid #e5e2da;font-size:10px;color:#888;line-height:1.5;white-space:pre-wrap;}
.no-print-bar{max-width:800px;margin:0 auto 16px;display:flex;justify-content:space-between;gap:10px;}
@media print{
  .no-print-bar,.sidebar,.tabbar,.mobile-settings-fab{display:none !important;}
  body{background:#fff;margin:0;}
  .print-sheet{padding:0;margin:0;max-width:none;width:100%;box-shadow:none;}
  .main{padding:0;max-width:none;margin:0;}
}
@page{size:A4;margin:12mm 15mm;}

/* Livre de recette table */
.lr-table{font-size:13px;}
.lr-table .amt{font-family:'JetBrains Mono',monospace;text-align:right;}
.lr-total-row td{font-weight:800;background:#FBFAF7;}

/* Toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:var(--radius);font-size:13.5px;font-weight:600;z-index:200;opacity:0;
  pointer-events:none;transition:opacity .2s,transform .2s;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

/* Scrollbar subtlety */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#00000022;border-radius:6px;}

@media(max-width:900px){
  .sidebar{display:none;}
  .main{padding:18px 16px 90px;}
  .tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ink);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;border-top:1px solid rgba(255,255,255,.08);
  }
  .tabbar button{
    flex:1;background:none;border:none;color:#9CA2A8;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;font-size:9.5px;font-weight:700;
  }
  .tabbar button svg{width:19px;height:19px;}
  .tabbar button.active{color:#fff;}
  .tabbar button.active svg{color:var(--rope);}
  .mobile-settings-fab{
    display:flex;align-items:center;justify-content:center;
    position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:41;
    width:36px;height:36px;border-radius:50%;background:var(--ink);color:#EDE9E1;border:none;
  }
  .mobile-settings-fab svg{width:17px;height:17px;}
}
</style>
</head>

<div id="toast"></div>
<div id="app"></div>

/* ---- Synchronisation multi-appareils (fonction Netlify + Netlify Blobs) ----
   Un seul entrepôt partagé pour ce site : tous les appareils qui ouvrent
   cette même appli déployée se synchronisent automatiquement, sans clé
   à copier. */
const SYNC_URL = '/api/gestion-data';
let SERVER_UPDATED_AT = 0;
let SYNC_STATUS = 'init'; // init | ok | offline | error

function setSyncStatus(status){
  SYNC_STATUS = status;
  const el = document.getElementById('sync-status');
  if(el) el.textContent = syncStatusLabel();
  const el2 = document.getElementById('sync-status-settings');
  if(el2) el2.textContent = syncStatusLabel();
}
function syncStatusLabel(){
  const map = {
    init:['⏳','Connexion…'],
    ok:['🟢','Synchronisé'],
    offline:['⚪','Hors ligne'],
    error:['🟠','Erreur de sync'],
  };
  const [dot,label] = map[SYNC_STATUS] || map.init;
  return `${dot} ${label}`;
}

async function pushToServer(){
  try{
    const res = await fetch(SYNC_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(DB)
    });
    if(res.ok){
      const json = await res.json();
      SERVER_UPDATED_AT = json.updatedAt;
      setSyncStatus('ok');
    } else { setSyncStatus('error'); }
  }catch(e){ setSyncStatus('offline'); }
}

async function pullFromServer(){
  try{
    const res = await fetch(SYNC_URL);
    if(!res.ok){ setSyncStatus('error'); return; }
    const json = await res.json();
    if(json.data && json.updatedAt && json.updatedAt > SERVER_UPDATED_AT){
      SERVER_UPDATED_AT = json.updatedAt;
      if(!openDrawer && ROUTE!=='devis-detail'){
        DB = normalizeDB(json.data);
        localStorage.setItem(STORE_KEY, JSON.stringify(DB));
        render();
        toast('Données mises à jour');
      }
    }
    setSyncStatus('ok');
  }catch(e){ setSyncStatus('offline'); }
}


function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._h);
  toast._h=setTimeout(()=>t.classList.remove('show'),2200);
}

function eur(n){
  n = Number(n)||0;
  return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDateLong(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function ensureYearCounters(){
  const y = new Date().getFullYear();
  if(DB.settings.counterYear !== y){
    DB.settings.counterYear = y;
    DB.settings.devisCounter = 1;
    DB.settings.factureCounter = 1;
    saveDB();
  }
}
function nextDevisNumber(){
  ensureYearCounters();
  const n = DB.settings.devisCounter;
  DB.settings.devisCounter++; saveDB();
  return `${DB.settings.devisPrefix}-${DB.settings.counterYear}-${String(n).padStart(3,'0')}`;
}
function nextFactureNumber(){
  ensureYearCounters();
  const n = DB.settings.factureCounter;
  DB.settings.factureCounter++; saveDB();
  return `${DB.settings.facturePrefix}-${DB.settings.counterYear}-${String(n).padStart(3,'0')}`;
}

function computeTotals(items, tvaApplicable){
  let ht=0, tva=0;
  (items||[]).forEach(it=>{
    const lineHt = (Number(it.qty)||0) * (Number(it.unitPrice)||0);
    ht += lineHt;
    if(tvaApplicable) tva += lineHt * ((Number(it.tva)||0)/100);
  });
  return { ht, tva, ttc: ht+tva };
}

function clientDisplayName(c){
  if(!c) return '—';
  const full = `${c.nom||''} ${c.prenom||''}`.trim();
  return (c.raisonSociale && c.raisonSociale.trim()) || full || 'Client sans nom';
}
function clientName(id){
  const c = DB.clients.find(c=>c.id===id);
  return clientDisplayName(c);
}
function clientById(id){ return DB.clients.find(c=>c.id===id); }
function mapsLink(address){
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
}
function printFileName(kind, doc){
  const label = kind==='devis' ? 'Devis' : 'Facture';
  return `${DB.settings.companyName || "Ain'Ccessible"} ${label} ${doc.number}`;
}
function clientDocNumber(kind, doc){
  const list = (kind==='devis' ? DB.devis : DB.factures)
    .filter(d=>d.clientId===doc.clientId)
    .sort((a,b)=> (a.date+a.number).localeCompare(b.date+b.number) || (a.id===doc.id?-1:1));
  const idx = list.findIndex(d=>d.id===doc.id);
  return String(idx>=0 ? idx+1 : list.length+1).padStart(3,'0');
}

    else if(ROUTE==='devis') main.innerHTML = viewDevisList();
    else if(ROUTE==='factures') main.innerHTML = viewFacturesList();
    else if(ROUTE==='livre') main.innerHTML = viewLivre();
    else if(ROUTE==='clients') main.innerHTML = viewClients();

  `;

function calendarHTML(){
  const y = CAL_MONTH.getFullYear(), m = CAL_MONTH.getMonth();
  const first = new Date(y,m,1);
  const startOffset = (first.getDay()+6)%7; // lundi=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const daysInPrev = new Date(y,m,0).getDate();
  const cells = [];
  for(let i=startOffset-1;i>=0;i--) cells.push({d:daysInPrev-i, out:true, iso:null});
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({d, out:false, iso});
  }
  while(cells.length % 7 !== 0) cells.push({d:cells.length, out:true, iso:null});
  const todayStr = todayISO();
  const dows = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

  return `
    <div class="cal-head">
      <div class="cal-title">${CAL_MONTH.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</div>
      <div class="cal-nav">
        <button class="btn outline sm" data-cal="prev">←</button>
        <button class="btn outline sm" data-cal="today">Aujourd'hui</button>
        <button class="btn outline sm" data-cal="next">→</button>
      </div>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(c=>{
        if(c.out) return `<div class="cal-cell out"></div>`;
        const evts = DB.planning.filter(e=>e.date===c.iso).sort((a,b)=>a.title.localeCompare(b.title));
        return `<div class="cal-cell ${c.iso===todayStr?'today':''}" data-day="${c.iso}">
          <div class="dnum">${c.d}</div>
          ${evts.slice(0,3).map(e=>`<div class="cal-evt ${e.clientId?'rope':''}" data-open-event="${e.id}">${esc(e.title)}</div>`).join('')}
          ${evts.length>3?`<div style="font-size:10px;color:var(--muted);margin-top:2px;">+${evts.length-3}</div>`:''}
        </div>`;
      }).join('')}
    </div>
  `;
}

function planningListHTML(){
  const sorted = [...DB.planning].sort((a,b)=>a.date.localeCompare(b.date));
  if(!sorted.length) return emptyHTML('Aucun événement','Créez votre premier rendez-vous ou chantier.');

function viewLivre(){
  const payees = DB.factures.filter(f=>f.status==='payee').sort((a,b)=>(a.paymentDate||a.date).localeCompare(b.paymentDate||b.date));
  let running = 0;
  const rowsHTML = payees.map((f,i)=>{

    return `<tr>
      <td class="mono">${i+1}</td>
      <td>${fmtDate(f.paymentDate||f.date)}</td>
      <td class="mono">${esc(f.number)}</td>

      <td>${esc(paymentMethodLabel(f.paymentMethod))}</td>
      <td class="amt">${eur(t.ttc)}</td>
      <td class="amt">${eur(running)}</td>
    </tr>`;
  }).join('');
  const total = payees.reduce((s,f)=>s+computeTotals(f.items,f.tvaApplicable).ttc,0);

  return `
    <div class="page-head">
      <div><h1>Livre de recettes</h1><p>Registre chronologique des encaissements — ${payees.length} opération${payees.length>1?'s':''}</p></div>

    </div>
    ${payees.length ? `<div class="card list-wrap"><table class="lr-table"><thead><tr>
      <th>#</th><th>Date encaiss.</th><th>N° facture</th><th>Client</th><th>Désignation</th><th>Règlement</th><th style="text-align:right;">Montant</th><th style="text-align:right;">Cumul</th>
    </tr></thead><tbody>${rowsHTML}</tbody></table></div>`
      : emptyHTML('Livre vide', 'Le livre se remplit automatiquement des que la facture correspondante est marquee Payee.')}
  `;

/* ============================================================
   MAIN EVENTS BINDING
   ============================================================ */
function bindMainEvents(){
  const main = document.getElementById('main');

  main.querySelectorAll('[data-open-event]').forEach(el=>el.onclick=()=>{
    const ev = DB.planning.find(x=>x.id===el.dataset.openEvent);
    openDrawer = {type:'event', data:ev};
    render();
  });
  main.querySelectorAll('[data-new-event]').forEach(el=>el.onclick=()=>{
    openDrawer = {type:'event', data:null};
    render();
  });
  main.querySelectorAll('[data-day]').forEach(el=>{
    el.addEventListener('dblclick',()=>{
      openDrawer = {type:'event', data:null, presetDate:el.dataset.day};
      render();
    });
  });
  main.querySelectorAll('[data-pview]').forEach(el=>el.onclick=()=>{ PLANNING_VIEW=el.dataset.pview; renderMain(); });
  main.querySelectorAll('[data-cal]').forEach(el=>el.onclick=()=>{
    if(el.dataset.cal==='prev') CAL_MONTH.setMonth(CAL_MONTH.getMonth()-1);
    else if(el.dataset.cal==='next') CAL_MONTH.setMonth(CAL_MONTH.getMonth()+1);
    else { CAL_MONTH = new Date(); CAL_MONTH.setDate(1); }
    renderMain();
  });

  main.querySelectorAll('[data-open-client]').forEach(el=>el.onclick=()=>{
    openDrawer = {type:'client', data: DB.clients.find(c=>c.id===el.dataset.openClient)};
    render();
  });
  main.querySelectorAll('[data-new-client]').forEach(el=>el.onclick=()=>{ openDrawer={type:'client',data:null}; render(); });

  main.querySelectorAll('[data-devisfilter]').forEach(el=>el.onclick=()=>{ DEVIS_FILTER=el.dataset.devisfilter; renderMain(); });
  main.querySelectorAll('[data-facturefilter]').forEach(el=>el.onclick=()=>{ FACTURE_FILTER=el.dataset.facturefilter; renderMain(); });

  main.querySelectorAll('[data-open-devis]').forEach(el=>el.onclick=()=>{
    ROUTE='devis-detail'; openDevisDetail(el.dataset.openDevis);
  });
  main.querySelectorAll('[data-new-devis]').forEach(el=>el.onclick=()=>{ openDrawer={type:'devis',data:null}; render(); });

  main.querySelectorAll('[data-open-facture]').forEach(el=>el.onclick=()=>{
    openFactureDetail(el.dataset.openFacture);
  });
  main.querySelectorAll('[data-new-facture]').forEach(el=>el.onclick=()=>{ openDrawer={type:'facture',data:null}; render(); });

  main.querySelectorAll('[data-new-catalogue]').forEach(el=>el.onclick=()=>{ openDrawer={type:'catalogue',data:null}; render(); });
  main.querySelectorAll('[data-edit-catalogue]').forEach(el=>el.onclick=()=>{
    openDrawer = {type:'catalogue', data: DB.catalogue.find(x=>x.id===el.dataset.editCatalogue)};
    render();
  });
  main.querySelectorAll('[data-delete-catalogue]').forEach(el=>el.onclick=()=>{
    DB.catalogue = DB.catalogue.filter(x=>x.id!==el.dataset.deleteCatalogue);
    saveDB(); toast('Prestation supprimée'); renderMain();
  });

  main.querySelectorAll('[data-new-fourniture]').forEach(el=>el.onclick=()=>{ openDrawer={type:'fourniture',data:null}; render(); });
  main.querySelectorAll('[data-edit-fourniture]').forEach(el=>el.onclick=()=>{
    openDrawer = {type:'fourniture', data: DB.fournitures.find(x=>x.id===el.dataset.editFourniture)};
    render();
  });
  main.querySelectorAll('[data-delete-fourniture]').forEach(el=>el.onclick=()=>{
    DB.fournitures = DB.fournitures.filter(x=>x.id!==el.dataset.deleteFourniture);
    saveDB(); toast('Fourniture supprimée'); renderMain();
  });

  const printBtn = main.querySelector('[data-print-livre]');
  if(printBtn) printBtn.onclick = ()=>printLivre();
  const csvBtn = main.querySelector('[data-export-csv]');
  if(csvBtn) csvBtn.onclick = ()=>exportLivreCSV();

  const saveSettingsBtn = main.querySelector('[data-save-settings]');
  if(saveSettingsBtn) saveSettingsBtn.onclick = saveSettingsForm;
  const exportJsonBtn = main.querySelector('[data-export-json]');
  if(exportJsonBtn) exportJsonBtn.onclick = exportBackup;
  const importFile = main.querySelector('#import-file');
  if(importFile) importFile.onchange = importBackup;

  const syncNowBtn = main.querySelector('[data-sync-now]');
  if(syncNowBtn) syncNowBtn.onclick = async ()=>{ await pushToServer(); await pullFromServer(); toast('Synchronisé'); };

  const enableNotifBtn = main.querySelector('[data-enable-notif]');
  if(enableNotifBtn) enableNotifBtn.onclick = requestNotificationPermission;
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `everest-gestion-sauvegarde-${todayISO()}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('Sauvegarde exportée');
}
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.settings || !data.clients) throw new Error('format invalide');
      DB = data; saveDB(); toast('Sauvegarde importée'); render();
    }catch(err){ toast('Fichier invalide'); }
  };
  reader.readAsText(file);
}

function exportLivreCSV(){
  const payees = DB.factures.filter(f=>f.status==='payee').sort((a,b)=>(a.paymentDate||a.date).localeCompare(b.paymentDate||b.date));
  let rows = [['#','Date encaissement','N° facture','Client','Désignation','Mode de règlement','Montant TTC']];
  payees.forEach((f,i)=>{
    const t = computeTotals(f.items, f.tvaApplicable);
    rows.push([i+1, fmtDate(f.paymentDate||f.date), f.number, clientName(f.clientId),
      (f.items[0]&&f.items[0].desc)||'', paymentMethodLabel(f.paymentMethod), t.ttc.toFixed(2).replace('.',',')]);
  });
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`livre-de-recettes-${todayISO()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function closeDrawerDOM(){
  const ex = document.getElementById('drawer-overlay');
  if(ex) ex.remove();
}
function renderDrawer(){
  closeDrawerDOM();
  const ov = document.createElement('div');
  ov.id = 'drawer-overlay';
  ov.className = 'overlay' + (openDrawer.type==='confirm' ? ' center' : '');
  ov.innerHTML = drawerContent();
  document.body.appendChild(ov);
  ov.addEventListener('mousedown', e=>{ if(e.target===ov){ openDrawer=null; render(); } });
  bindDrawerEvents();
}
function drawerContent(){
  if(openDrawer.type==='event') return eventDrawerHTML(openDrawer.data);
  if(openDrawer.type==='client') return clientDrawerHTML(openDrawer.data);
  if(openDrawer.type==='devis') return devisFormDrawerHTML(openDrawer.data);
  if(openDrawer.type==='facture') return factureFormDrawerHTML(openDrawer.data);
  if(openDrawer.type==='catalogue') return catalogueDrawerHTML(openDrawer.data);
  if(openDrawer.type==='fourniture') return fournitureDrawerHTML(openDrawer.data);
  return '';
}

/* ---- Drawer events ---- */
function bindDrawerEvents(){
  const ov = document.getElementById('drawer-overlay');
  ov.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>{ openDrawer=null; render(); });
  ov.querySelectorAll('[data-maps-for]').forEach(btn=>{
    btn.onclick = ()=>{
      let val = document.getElementById(btn.dataset.mapsFor).value.trim();
      const extraId = btn.dataset.mapsExtra;
      if(extraId){
        const extraVal = document.getElementById(extraId).value.trim();
        if(extraVal) val = (val + ' ' + extraVal).trim();
      }
      if(!val){ toast('Renseignez une adresse'); return; }
      window.open(mapsLink(val), '_blank');
    };
  });

  // line items (devis/facture)
  const addLineBtn = ov.querySelector('[data-add-line]');
  if(addLineBtn){
    const tvaApplicable = openDrawer.type==='devis' ? DB.settings.tvaApplicable : (openDrawer.data? openDrawer.data.tvaApplicable : DB.settings.tvaApplicable);
    addLineBtn.onclick = ()=>{
      const wrap = ov.querySelector('#li-rows');
      const idx = wrap.children.length;
      wrap.insertAdjacentHTML('beforeend', lineRowHTML({desc:'',qty:1,unitPrice:'',tva:DB.settings.tvaDefault}, idx, tvaApplicable));
      bindLineRowEvents(tvaApplicable);
      refreshTotalsPreview(tvaApplicable);
    };
    bindLineRowEvents(tvaApplicable);
    refreshTotalsPreview(tvaApplicable);

    const toggleForfaitsBtn = ov.querySelector('[data-toggle-forfaits]');
    const forfaitPicker = ov.querySelector('#forfait-picker');
    if(toggleForfaitsBtn && forfaitPicker){
      toggleForfaitsBtn.onclick = ()=>{
        forfaitPicker.style.display = forfaitPicker.style.display==='none' ? 'grid' : 'none';
      };
      forfaitPicker.querySelectorAll('[data-pick-forfait]').forEach(card=>{
        card.onclick = ()=>{
          const it = DB.catalogue.find(x=>x.id===card.dataset.pickForfait);
          if(!it) return;
          const wrap = ov.querySelector('#li-rows');
          const idx = wrap.children.length;
          wrap.insertAdjacentHTML('beforeend', lineRowHTML({desc:it.desc,qty:1,unitPrice:it.price,tva:DB.settings.tvaDefault,comment:it.comment||''}, idx, tvaApplicable));
          bindLineRowEvents(tvaApplicable);
          refreshTotalsPreview(tvaApplicable);
          toast('Forfait ajouté');
        };
      });
    }

    const toggleFournituresBtn = ov.querySelector('[data-toggle-fournitures]');
    const fournyPicker = ov.querySelector('#fourniture-picker');
    if(toggleFournituresBtn && fournyPicker){
      toggleFournituresBtn.onclick = ()=>{
        fournyPicker.style.display = fournyPicker.style.display==='none' ? 'grid' : 'none';
      };
      fournyPicker.querySelectorAll('[data-pick-fourniture]').forEach(card=>{
        card.onclick = ()=>{
          const it = DB.fournitures.find(x=>x.id===card.dataset.pickFourniture);
          if(!it) return;
          const wrap = ov.querySelector('#li-rows');
          const idx = wrap.children.length;
          wrap.insertAdjacentHTML('beforeend', lineRowHTML({desc:it.desc,qty:1,unitPrice:it.price,tva:DB.settings.tvaDefault,comment:it.comment||''}, idx, tvaApplicable));
          bindLineRowEvents(tvaApplicable);
          refreshTotalsPreview(tvaApplicable);
          toast('Fourniture ajoutée');
        };
      });
    }
  }

  if(openDrawer.type==='event'){
    const clientSelect = ov.querySelector('#ev-client');
    if(clientSelect) clientSelect.onchange = ()=>{
      const c = clientById(clientSelect.value);
      if(!c) return;
      const phoneInput = document.getElementById('ev-phone');
      const locationInput = document.getElementById('ev-location');
      if(c.phone) phoneInput.value = c.phone;
      const addr = `${c.address||''} ${c.zipCity||''}`.trim();
      if(addr) locationInput.value = addr;
    };
    const saveBtn = ov.querySelector('[data-save-event]');
    if(saveBtn) saveBtn.onclick = ()=>{
      const title = document.getElementById('ev-title').value.trim();
      if(!title){ toast('Titre requis'); return; }
      const data = {
        title,
        date: document.getElementById('ev-date').value,
        clientId: document.getElementById('ev-client').value || null,
        phone: document.getElementById('ev-phone').value.trim(),
        location: document.getElementById('ev-location').value.trim(),
        notes: document.getElementById('ev-notes').value,
      };
      if(openDrawer.data){ Object.assign(openDrawer.data, data); }
      else { DB.planning.push({id:uid(), ...data}); }
      saveDB(); openDrawer=null; toast('Événement enregistré'); render();
    };
    const delBtn = ov.querySelector('[data-delete-event]');
    if(delBtn) delBtn.onclick = ()=>{
      DB.planning = DB.planning.filter(e=>e.id!==delBtn.dataset.deleteEvent);
      saveDB(); openDrawer=null; toast('Événement supprimé'); render();
    };
  }

  if(openDrawer.type==='client'){
    const saveBtn = ov.querySelector('[data-save-client]');
    if(saveBtn) saveBtn.onclick = ()=>{
      const prenom = document.getElementById('cl-prenom').value.trim();
      const nom = document.getElementById('cl-nom').value.trim();
      const raisonSociale = document.getElementById('cl-raisonSociale').value.trim();
      if(!prenom && !nom && !raisonSociale){ toast('Indiquez au moins un nom ou une raison sociale'); return; }
      const ageVal = document.getElementById('cl-age').value;
      const data = {
        prenom, nom, raisonSociale,
        age: ageVal? parseInt(ageVal) : null,
        email: document.getElementById('cl-email').value.trim(),
        phone: document.getElementById('cl-phone').value.trim(),
        address: document.getElementById('cl-address').value.trim(),
        zipCity: document.getElementById('cl-zipCity').value.trim(),
        notes: document.getElementById('cl-notes').value,
      };
      if(openDrawer.data){ Object.assign(openDrawer.data, data); }
      else { DB.clients.push({id:uid(), ...data}); }
      saveDB(); openDrawer=null; toast('Client enregistré'); render();
    };
    const delBtn = ov.querySelector('[data-delete-client]');
    if(delBtn) delBtn.onclick = ()=>{
      DB.clients = DB.clients.filter(c=>c.id!==delBtn.dataset.deleteClient);
      saveDB(); openDrawer=null; toast('Client supprimé'); render();
    };
  }

  if(openDrawer.type==='devis'){
    const saveBtn = ov.querySelector('[data-save-devis]');
    if(saveBtn) saveBtn.onclick = ()=>{
      const clientId = document.getElementById('dv-client').value;
      if(!clientId){ toast('Sélectionnez un client'); return; }
      const items = readLineItemsFromDOM();
      if(!items.length){ toast('Ajoutez au moins une ligne'); return; }
      const date = document.getElementById('dv-date').value;
      const validUntil = new Date(new Date(date).getTime() + DB.settings.devisValidityDays*86400000).toISOString().slice(0,10);
      const data = {
        clientId, date, validUntil,
        objet: document.getElementById('dv-objet').value.trim(),
        items,
        tvaApplicable: DB.settings.tvaApplicable,
        status: document.getElementById('dv-status').value,
        notes: document.getElementById('dv-notes').value,
      };
      if(openDrawer.data){ Object.assign(openDrawer.data, data); saveDB(); toast('Devis mis à jour'); openDrawer=null; render(); }
      else {
        const nd = {id:uid(), number: nextDevisNumber(), ...data};
        DB.devis.push(nd); saveDB(); toast('Devis créé'); openDrawer=null; ROUTE='devis'; render();
        openDevisDetail(nd.id);
      }
    };
    const delBtn = ov.querySelector('[data-delete-devis]');
    if(delBtn) delBtn.onclick = ()=>{
      DB.devis = DB.devis.filter(x=>x.id!==delBtn.dataset.deleteDevis);
      saveDB(); openDrawer=null; toast('Devis supprimé'); go('devis');
    };
  }

  if(openDrawer.type==='facture'){
    const saveBtn = ov.querySelector('[data-save-facture]');
    if(saveBtn) saveBtn.onclick = ()=>{
      const clientId = document.getElementById('fa-client').value;
      if(!clientId){ toast('Sélectionnez un client'); return; }
      const items = readLineItemsFromDOM();
      if(!items.length){ toast('Ajoutez au moins une ligne'); return; }
      const status = document.getElementById('fa-status').value;
      const paymentDate = document.getElementById('fa-paymentDate').value;
      const wasEnvoyee = openDrawer.data && openDrawer.data.status==='envoyee';
      const data = {
        clientId,
        date: document.getElementById('fa-date').value,
        dueDate: document.getElementById('fa-dueDate').value,
        objet: document.getElementById('fa-objet').value.trim(),
        items,
        tvaApplicable: openDrawer.data ? openDrawer.data.tvaApplicable : DB.settings.tvaApplicable,
        status,
        paymentMethod: document.getElementById('fa-paymentMethod').value,
        paymentDate: status==='payee' ? (paymentDate||todayISO()) : paymentDate,
        notes: document.getElementById('fa-notes').value,
      };
      if(status==='envoyee' && !wasEnvoyee){ data.envoyeeAt = Date.now(); }
      if(status!=='envoyee' && status!=='retard'){ data.envoyeeAt = null; }
      if(openDrawer.data){ Object.assign(openDrawer.data, data); saveDB(); toast('Facture mise à jour'); openDrawer=null; render(); }
      else {
        const nf = {id:uid(), number: nextFactureNumber(), devisId: openDrawer.fromDevisId||null, ...data};
        DB.factures.push(nf); saveDB(); toast('Facture créée'); openDrawer=null; ROUTE='factures'; render();
        openFactureDetail(nf.id);
      }
    };
    const delBtn = ov.querySelector('[data-delete-facture]');
    if(delBtn) delBtn.onclick = ()=>{
      DB.factures = DB.factures.filter(x=>x.id!==delBtn.dataset.deleteFacture);
      saveDB(); openDrawer=null; toast('Facture supprimée'); go('factures');
    };
  }

  if(openDrawer.type==='catalogue'){
    const saveBtn = ov.querySelector('[data-save-catalogue]');
    if(saveBtn) saveBtn.onclick = ()=>{
      const desc = document.getElementById('ct-desc').value.trim();
      if(!desc){ toast('Désignation requise'); return; }
      const price = parseFloat(document.getElementById('ct-price').value)||0;
      const comment = document.getElementById('ct-comment').value.trim();
      if(openDrawer.data){ Object.assign(openDrawer.data, {desc, price, comment}); }
      else { DB.catalogue.push({id:uid(), desc, price, comment}); }
      saveDB(); openDrawer=null; toast('Prestation enregistrée'); render();
    };
    const delBtn = ov.querySelector('[data-delete-catalogue-item]');
    if(delBtn) delBtn.onclick = ()=>{
      DB.catalogue = DB.catalogue.filter(x=>x.id!==delBtn.dataset.deleteCatalogueItem);
      saveDB(); openDrawer=null; toast('Prestation supprimée'); render();
    };
  }

  if(openDrawer.type==='fourniture'){
    const buyInput = ov.querySelector('#fn-buyprice');
    const marginInput = ov.querySelector('#fn-margin');
    const sellDisplay = ov.querySelector('#fn-sellprice-display');
    const updateSellPrice = ()=>{
      const buy = parseFloat(buyInput.value)||0;
      const margin = parseFloat(marginInput.value)||0;
      sellDisplay.textContent = eur(buy * (1 + margin/100));
    };
    if(buyInput && marginInput){
      buyInput.oninput = updateSellPrice;
      marginInput.oninput = updateSellPrice;
    }
    const saveBtn = ov.querySelector('[data-save-fourniture]');
    if(saveBtn) saveBtn.onclick = ()=>{
      const desc = document.getElementById('fn-desc').value.trim();
      if(!desc){ toast('Désignation requise'); return; }
      const buyPrice = parseFloat(document.getElementById('fn-buyprice').value)||0;
      const marginPercent = parseFloat(document.getElementById('fn-margin').value)||0;
      const price = Math.round(buyPrice * (1 + marginPercent/100) * 100) / 100;
      const comment = document.getElementById('fn-comment').value.trim();
      if(openDrawer.data){ Object.assign(openDrawer.data, {desc, buyPrice, marginPercent, price, comment}); }
      else { DB.fournitures.push({id:uid(), desc, buyPrice, marginPercent, price, comment}); }
      saveDB(); openDrawer=null; toast('Fourniture enregistrée'); render();
    };
    const delBtn = ov.querySelector('[data-delete-fourniture-item]');
    if(delBtn) delBtn.onclick = ()=>{
      DB.fournitures = DB.fournitures.filter(x=>x.id!==delBtn.dataset.deleteFournitureItem);
      saveDB(); openDrawer=null; toast('Fourniture supprimée'); render();
    };
  }
}

function bindLineRowEvents(tvaApplicable){
  const ov = document.getElementById('drawer-overlay');
  ov.querySelectorAll('#li-rows input').forEach(inp=>{
    inp.oninput = ()=>{
      if(inp.dataset.li==='desc'){
        const match = [...DB.catalogue,...DB.fournitures].find(it=>it.desc===inp.value);
        if(match){
          const row = inp.closest('[data-line]');
          row.querySelector('[data-li=unitPrice]').value = match.price;
          row.querySelector('[data-li=comment]').value = match.comment || '';
        }
      }
      refreshTotalsPreview(tvaApplicable);
    };
  });
  ov.querySelectorAll('[data-remove-line]').forEach(btn=>{
    btn.onclick = ()=>{
      btn.closest('[data-line]').remove();
      refreshTotalsPreview(tvaApplicable);
    };
  });
}

/* ============================================================

  document.getElementById('main').innerHTML = printableDocHTML('devis', d);
  bindPrintableEvents('devis', d);

}
function openFactureDetail(id){
  const f = DB.factures.find(x=>x.id===id);
  if(!f) return go('factures');
  document.getElementById('main').innerHTML = printableDocHTML('facture', f);
  bindPrintableEvents('facture', f);
  window.scrollTo(0,0);
}

function bindPrintableEvents(kind, doc){
  const main = document.getElementById('main');
  const back = main.querySelector('[data-back]');
  if(back) back.onclick = ()=>go(kind==='devis'?'devis':'factures');
  const printBtn = main.querySelector('[data-print]');
  if(printBtn) printBtn.onclick = ()=>{
    const prevTitle = document.title;
    document.title = printFileName(kind, doc);
    const restore = ()=>{ document.title = prevTitle; window.removeEventListener('afterprint', restore); };
    window.addEventListener('afterprint', restore);
    window.print();
    setTimeout(restore, 15000);
  };
  const editBtn = main.querySelector('[data-edit-doc]');
  if(editBtn) editBtn.onclick = ()=>{ openDrawer = {type:kind, data:doc}; render(); };
  const toFactureBtn = main.querySelector('[data-to-facture]');
  if(toFactureBtn) toFactureBtn.onclick = ()=>{
    const nf = {
      id:uid(), number: nextFactureNumber(), devisId: doc.id,
      clientId: doc.clientId, date: todayISO(),
      dueDate: new Date(Date.now()+30*86400000).toISOString().slice(0,10),
      objet: doc.objet, items: JSON.parse(JSON.stringify(doc.items)),
      tvaApplicable: doc.tvaApplicable, status:'brouillon', paymentMethod:'virement',
      paymentDate:'', notes: doc.notes,
    };
    DB.factures.push(nf); saveDB(); toast('Facture créée à partir du devis');
    ROUTE='factures'; openFactureDetail(nf.id);
  };
}

/* ============================================================
   FACTURES EN RETARD — bascule auto + notification
   ============================================================ */
function delayToMinutes(value, unit){
  const perUnit = {minutes:1, heures:60, jours:1440, semaines:1440*7, mois:1440*30};
  const mins = (Number(value)||1) * (perUnit[unit]||perUnit.mois);
  return Math.min(Math.max(mins, 1), 1440*61); // borné entre 1 minute et ~2 mois
}
function checkOverdueFactures(){
  const now = Date.now();
  const delayMs = delayToMinutes(DB.settings.retardDelayValue, DB.settings.retardDelayUnit) * 60000;
  const newlyLate = [];
  DB.factures.forEach(f=>{
    if(f.status==='envoyee'){
      if(!f.envoyeeAt){
        // Facture existante sans horodatage : on l'initialise à sa date d'échéance (ou date du jour si passée)
        const base = f.dueDate ? new Date(f.dueDate+'T00:00:00').getTime() - delayMs : now;
        f.envoyeeAt = base;
      }
      if(now - f.envoyeeAt >= delayMs){
        f.status = 'retard';
        newlyLate.push(f);
      }
    }
  });
  if(newlyLate.length){
    saveDB();
    if(ROUTE==='factures' || ROUTE==='dashboard') renderMain();
    const msg = newlyLate.length===1
      ? `Facture ${newlyLate[0].number} passée en retard`
      : `${newlyLate.length} factures passées en retard`;
    notifyUser('Facture en retard', msg);
  }
}
function notifyUser(title, body){
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification(title, {body, icon:'/apple-touch-icon.png'}); return; }catch(e){}
  }
  toast(body);
}
function requestNotificationPermission(){
  if(!('Notification' in window)){ toast("Notifications non supportées sur cet appareil"); return; }
  Notification.requestPermission().then(perm=>{
    if(perm==='granted') toast('Notifications activées');
    else toast('Notifications refusées');
    renderMain();
  });
}
function notifPermissionBadge(){
  if(typeof Notification==='undefined') return {label:'Non supporté', color:'grey'};
  const map = {granted:['Activées','green'], denied:['Refusées','red'], default:['Désactivées','grey']};
  const [label,color] = map[Notification.permission] || map.default;
  return {label,color};
}

render();
pullFromServer();
checkOverdueFactures();
setInterval(pullFromServer, 6000);
setInterval(checkOverdueFactures, 5*60*1000);
